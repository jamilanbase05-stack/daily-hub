name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare web folder
        run: |
          mkdir -p www
          if [ -f index.html ]; then
            cp index.html www/index.html
          else
            h=$(find . -path ./www -prune -o -name "*.html" -print | head -n 1)
            if [ -n "$h" ]; then cp "$h" www/index.html; fi
          fi
          test -f www/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create Capacitor project
        run: |
          [ -f package.json ] || npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          echo '{"appId":"com.dailyhub.app","appName":"Daily Hub","webDir":"www","plugins":{"CapacitorHttp":{"enabled":true}}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: daily-hub-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
